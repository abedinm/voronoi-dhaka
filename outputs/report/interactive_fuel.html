        } else {

        }

    let aliases = ["facility", "cell km\u00b2"];
    let table = '<table>' +

        fields.map(

        `<tr>
            <th>${aliases[i]}</th>
            
            <td>${handleObject(layer.feature.properties[v])}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
